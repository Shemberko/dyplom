<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --danger: #ef4444;
            --border: #e2e8f0;
        }

        body {
            width: 320px;
            margin: 0;
            padding: 20px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
        }

        h3 {
            margin: 0 0 16px 0;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h3::before {
            content: '';
            width: 8px;
            height: 18px;
            background: var(--primary);
            border-radius: 4px;
        }

        /* Список доменів */
        .list {
            max-height: 240px;
            overflow-y: auto;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        /* Стилізація скролбару */
        .list::-webkit-scrollbar {
            width: 6px;
        }
        .list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 8px;
            transition: background 0.2s;
            margin-bottom: 4px;
        }

        .item:hover {
            background: #f1f5f9;
        }

        .item span {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .remove-btn {
            color: var(--text-muted);
            cursor: pointer;
            border: none;
            background: transparent;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
            font-size: 16px;
        }

        .remove-btn:hover {
            color: var(--danger);
            background: #fee2e2;
        }

        /* Форма додавання */
        .input-group {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        button#add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button#add-btn:hover {
            background: var(--primary-hover);
        }

        button#add-btn:active {
            transform: scale(0.96);
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <h3>Ігнорування</h3>
    
    <div class="list" id="domain-list">
        <div class="empty-state">Список порожній</div>
    </div>

    <div class="input-group">
        <input type="text" id="domain-input" placeholder="Напр: facebook.com">
        <button id="add-btn">Додати</button>
    </div>

    <script type="module" src="./src/popup.js"></script>
</body>
</html>
